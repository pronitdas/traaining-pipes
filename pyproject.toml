[project]
name = "training-pipe"
version = "0.1.0"
description = "Personal agentic coding model training pipeline"
requires-python = ">=3.12"
dependencies = [
    "datasets>=2.20.0",
    "transformers>=4.44.0",
    "peft>=0.12.0",
    "trl>=0.9.0",
    "accelerate>=0.34.0",
    "bitsandbytes>=0.43.0",
    "torch>=2.4.0",
    "vllm>=0.6.0",
    "sqlite-utils>=3.36.0",
    "tiktoken>=0.7.0",
    "sentencepiece>=0.2.0",
    "protobuf>=5.0.0",
    "jsonlines>=4.0.0",
    "tqdm>=4.66.0",
    "rich>=13.8.0",
]

[tool.uv]
dev-dependencies = [
    "ipython>=8.27.0",
    "pytest>=8.3.0",
]
