name: build base image

# Builds the frozen RunPod training base and pushes it to GHCR. Runs on changes to the
# Dockerfile or to the code the image bakes in, so the tag always matches the repo.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - src/**
      - configs/**
      - scripts/**
      - .github/workflows/build-base-image.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/training-pipe

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The CUDA base is ~8GB and the runner only has ~14GB free by default; reclaiming the
      # preinstalled Android/dotnet/Haskell toolchains avoids a no-space-left build failure.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:base
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "pushed \`${{ env.IMAGE }}:base\`" >> $GITHUB_STEP_SUMMARY
          echo "and \`${{ env.IMAGE }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
